; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c5-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_speed = 115200
board = esp32-c5-devkitc1-n16r8
framework = espidf
board_build.partitions = default_16MB.csv
build_type = debug
monitor_filters = esp32_exception_decoder
build_flags = 
	-Wno-missing-field-initializers
	-Wno-implicit-fallthrough
	-Wno-error=missing-field-initializers
	-Wno-error=implicit-fallthrough
debug_server =
	${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
	-s ${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts
	-f interface\esp_usb_jtag.cfg
	-c "transport select jtag"
	-f target\esp32c5.cfg
	-c "reset_config none"
board_build.embed_txtfiles =
	../pki/LWT_Server_debug_key.key
	../pki/esp32-alice.crt
	../pki/esp32-bob.crt
	../pki/Ticket_signing_key_pub.pem
	../pki/ROPID_Root_CA_Certificate_[DEBUG].crt