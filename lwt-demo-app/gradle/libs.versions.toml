[versions]
agp = "9.3.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
flatbuffers = "25.2.10"
okhttp = "5.5.0"
tlsChannel = "1.0.0"
swipeRefreshLayout = "1.2.0"
flexboxLayout = "3.0.0"
zxing = "3.5.4"
javaOtp = "1.0.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
flatbuffers-java = { group = "com.google.flatbuffers", name = "flatbuffers-java", version.ref = "flatbuffers" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
tlsChannel = { group = "com.github.marianobarrios", name = "tls-channel", version.ref = "tlsChannel" }
swipeRefreshLayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swipeRefreshLayout" }
flexboxLayout = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexboxLayout" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
javaOtp = { module = "com.eatthepath:java-otp", version.ref = "javaOtp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

